<!doctype html>
<html lang="en" class="w-full max-w-full overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Code Point Kenya</title>
    <meta name="description" content="Premier tech school in Nairobi offering online-first and in-person programs in Software Engineering, Data Science, AI, and Cybersecurity." />
    <meta property="og:title" content="Code Point Kenya" />
    <meta property="og:description" content="Premier tech school in Nairobi offering online-first and in-person programs in Software Engineering, Data Science, AI, and Cybersecurity." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
      (function() {
        try {
          var p = localStorage.getItem('cpk_theme_primary') || '#10B981';
          var s = localStorage.getItem('cpk_theme_secondary') || '#06B6D4';
          var m = localStorage.getItem('cpk_theme_mode') || 'system';
          var customBg = localStorage.getItem('cpk_canvas_bg') || '';

          var hexToRgb = function(hex) {
            var c = (hex || '').replace('#', '').trim();
            if (c.length === 3) c = c.split('').map(function(x) { return x + x; }).join('');
            var n = parseInt(c, 16);
            if (isNaN(n) || c.length !== 6) return { r: 16, g: 185, b: 129, str: '16, 185, 129' };
            var r = (n >> 16) & 255;
            var g = (n >> 8) & 255;
            var b = n & 255;
            return { r: r, g: g, b: b, str: r + ', ' + g + ', ' + b };
          };

          var isSystemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effectiveMode = m === 'light' ? 'light' : (m === 'dark' ? 'dark' : (isSystemDark ? 'dark' : 'light'));

          var activeBg = (customBg || '').trim();
          if (!activeBg) {
            activeBg = effectiveMode === 'light' ? '#F8FAFC' : '#020617';
          } else if (!activeBg.startsWith('#')) {
            activeBg = '#' + activeBg;
          }

          var bgRgb = hexToRgb(activeBg);
          var lum = (0.299 * bgRgb.r + 0.587 * bgRgb.g + 0.114 * bgRgb.b) / 255;
          var isBright = lum > 0.5;

          var root = document.documentElement;
          if (isBright) {
            root.classList.add('light-theme');
            root.classList.remove('dark');
          } else {
            root.classList.remove('light-theme');
            root.classList.add('dark');
          }

          var activeText = isBright ? '#0F172A' : '#F8FAFC';
          var activeMuted = isBright ? '#475569' : '#94A3B8';
          var activeHeading = isBright ? '#0F172A' : '#FFFFFF';
          var activeSurface = isBright ? 'rgba(255, 255, 255, 0.95)' : 'rgba(15, 23, 42, 0.75)';
          var activeSurfaceAlt = isBright ? 'rgba(0, 0, 0, 0.04)' : 'rgba(255, 255, 255, 0.02)';
          var activeBorder = isBright ? 'rgba(15, 23, 42, 0.12)' : 'rgba(51, 65, 85, 0.55)';
          var activeNavBg = isBright ? 'rgba(255, 255, 255, 0.92)' : 'rgba(2, 6, 23, 0.85)';

          root.style.setProperty('--color-canvas-bg', activeBg);
          root.style.setProperty('--canvas-bg', activeBg);
          root.style.setProperty('--color-text-main', activeText);
          root.style.setProperty('--color-canvas-text', activeText);
          root.style.setProperty('--color-canvas-muted', activeMuted);
          root.style.setProperty('--color-canvas-heading', activeHeading);
          root.style.setProperty('--color-canvas-surface', activeSurface);
          root.style.setProperty('--color-canvas-surface-alt', activeSurfaceAlt);
          root.style.setProperty('--color-canvas-border', activeBorder);
          root.style.setProperty('--nav-bg', activeNavBg);
          root.style.setProperty('--bg-dark', activeBg);

          var r1 = hexToRgb(p).str;
          var r2 = hexToRgb(s).str;
          root.style.setProperty('--primary', p);
          root.style.setProperty('--primary-color', p);
          root.style.setProperty('--primary-rgb', r1);
          root.style.setProperty('--cpk-primary', p);
          root.style.setProperty('--secondary', s);
          root.style.setProperty('--secondary-color', s);
          root.style.setProperty('--secondary-rgb', r2);
          root.style.setProperty('--accent', s);
          root.style.setProperty('--accent-color', s);
          root.style.setProperty('--accent-rgb', r2);
          root.style.setProperty('--highlight-color', p);
          root.style.setProperty('--badge-bg', 'rgba(' + r1 + ', 0.12)');
          root.style.setProperty('--badge-text', p);
          root.style.setProperty('--badge-border', 'rgba(' + r1 + ', 0.28)');
          root.style.setProperty('--card-highlight-border', 'rgba(' + r1 + ', 0.35)');
          root.style.setProperty('--card-highlight-glow', 'rgba(' + r1 + ', 0.16)');
          root.style.setProperty('--card-accent-border', 'rgba(' + r2 + ', 0.35)');
          root.style.setProperty('--card-accent-glow', 'rgba(' + r2 + ', 0.16)');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="w-full max-w-full overflow-x-hidden min-h-screen bg-slate-950 text-slate-100">
    <div id="root" class="w-full max-w-full overflow-x-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
